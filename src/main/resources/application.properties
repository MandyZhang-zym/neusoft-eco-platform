spring.application.name=neusoft-eco-platform

# 本机私有配置（数据库密码）放在 application-local.properties，该文件已被 .gitignore 忽略
spring.profiles.active=local

# ===== 数据源 =====
# createDatabaseIfNotExist=true：库不存在时自动创建，组员无需手动建库
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/neusoft_eco?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== 启动时自动执行建表 / 示例数据脚本（脚本内均为幂等写法，可重复执行）=====
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.data-locations=classpath:sql/data.sql

# ===== MyBatis-Plus =====
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false
